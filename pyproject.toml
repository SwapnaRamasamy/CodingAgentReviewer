[project]
name = "coding-agent-reviewer"
version = "0.1.0"
description = "Evidence-based multi-agent code review with human-approved fixes"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.45,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "mcp>=1.28,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pathspec>=0.12,<1",
  "truststore>=0.10.5,<0.11",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.11,<1",
  "jsonschema>=4.23,<5",
  "deepagents>=0.7.35,<0.8",
  "langchain>=1.4.10,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
